<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tribu</title>
<meta name="description" content="Organisation familiale : taches menageres, courses, menus de la semaine, pense-betes et points a echanger contre des cadeaux.">
<meta name="theme-color" content="#4E7A6A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="firebase-config.js"></script>
</head>
<body>

<!-- ============ Ecran de connexion (rempli par app.js) ============ -->
<div class="connexion" id="ecran-connexion" hidden></div>

<!-- ============ Application ============ -->
<div class="app" id="ecran-app" hidden>

  <header class="topbar">
    <button class="avatar" id="btn-profil" title="Mon profil" data-action="menu-profil">🙂</button>
    <button class="topbar-titre" id="btn-entete" data-action="aller" data-vue="accueil">
      <b id="titre-vue">Accueil</b>
      <span id="sous-titre-vue"></span>
    </button>
    <button class="pastille-points" id="btn-points" title="Mes points" data-action="aller" data-vue="points">
      <span>🌟</span><span id="mes-points">0</span>
    </button>
  </header>

  <main>
    <section class="vue" id="vue-accueil"></section>
    <section class="vue" id="vue-taches"></section>
    <section class="vue" id="vue-courses"></section>
    <section class="vue" id="vue-menus"></section>
    <section class="vue" id="vue-notes"></section>
    <section class="vue" id="vue-points"></section>
    <section class="vue" id="vue-recettes"></section>
    <section class="vue" id="vue-admin"></section>
  </main>

  <button class="fab" id="fab" hidden>+</button>

  <nav class="nav">
    <div class="nav-inner">
      <button data-vue="accueil"><span class="ic">🏡</span>Accueil</button>
      <button data-vue="taches"><span class="ic">🧹</span>Tâches</button>
      <button data-vue="courses"><span class="ic">🛒</span>Courses</button>
      <button data-vue="menus"><span class="ic">🍽️</span>Menus</button>
      <button data-vue="notes"><span class="ic">🔔</span>Rappels</button>
    </div>
  </nav>

</div>

<!-- ============ Feuille modale + toast ============ -->
<div class="voile" id="voile">
  <div class="feuille" id="feuille" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<script src="recettes.js"></script>
<script src="vues.js"></script>
<script src="formulaires.js"></script>
<script src="app.js"></script>
</body>
</html>
